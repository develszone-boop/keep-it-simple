name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Prerender static pages
        timeout-minutes: 10
        run: node scripts/prerender.js

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Listing dist directory"
          echo "======================================"

          if [ ! -d dist ]; then
            echo "ERROR: dist directory does not exist"
            exit 1
          fi

          find dist -maxdepth 3 -type f | sort

          echo ""
          echo "======================================"
          echo "Resolved Nitro output directory"
          echo "======================================"

          if [ -f dist/nitro.json ]; then
            cat dist/nitro.json
            resolved_public="$(node -e "const m=require('./dist/nitro.json');process.stdout.write(m.publicDir||'')")"
            echo ""
            echo "nitro publicDir: ${resolved_public:-<unset>}"
            if [ -n "$resolved_public" ] && [ "$resolved_public" != "client" ] && [ "$resolved_public" != "dist/client" ]; then
              echo "ERROR: build wrote its public files to '$resolved_public', but this workflow uploads dist/client."
              echo "Fix nitro.output.publicDir in vite.config.ts so both agree."
              exit 1
            fi
          else
            echo "WARNING: dist/nitro.json not found"
          fi

          echo ""
          echo "======================================"
          echo "Listing dist/client"
          echo "======================================"

          if [ ! -d dist/client ]; then
            echo "ERROR: dist/client does not exist"
            exit 1
          fi

          find dist/client -maxdepth 4 -type f | sort

          echo ""
          echo "======================================"
          echo "Checking required files"
          echo "======================================"

          check_file () {
            if [ -f "$1" ]; then
              echo "✓ $1"
            else
              echo "✗ MISSING: $1"
              exit 1
            fi
          }

          check_file dist/client/index.html
          check_file dist/client/404.html
          check_file dist/client/CNAME
          check_file dist/client/about/index.html
          check_file dist/client/services/index.html
          check_file dist/client/process/index.html
          check_file dist/client/portfolio/index.html
          check_file dist/client/faq/index.html
          check_file dist/client/contact/index.html

          echo ""
          echo "======================================"
          echo "CNAME"
          echo "======================================"

          if [ -f dist/client/CNAME ]; then
            cat dist/client/CNAME
          fi

          grep -Fxq "trikalnetra.com" dist/client/CNAME

          echo ""
          echo "======================================"
          echo "Checking generated application content"
          echo "======================================"

          check_app_html () {
            local file="$1"
            grep -Eqi '<!doctype html|<html' "$file" || {
              echo "ERROR: $file is not an HTML document"
              exit 1
            }
            grep -qi 'trikalnetra' "$file" || {
              echo "ERROR: $file does not contain trikalnetra application metadata"
              exit 1
            }
            if grep -Eqi 'generator[^>]*jekyll|Build with Lovable|npm i && npm run dev' "$file"; then
              echo "ERROR: $file contains Jekyll/README output instead of the application"
              exit 1
            fi
            echo "✓ Application HTML: $file"
          }

          check_app_html dist/client/index.html
          check_app_html dist/client/404.html
          check_app_html dist/client/about/index.html
          check_app_html dist/client/services/index.html
          check_app_html dist/client/process/index.html
          check_app_html dist/client/portfolio/index.html
          check_app_html dist/client/faq/index.html
          check_app_html dist/client/contact/index.html

          asset_refs="$(grep -Eo '(src|href)=[\"'"'"']/assets/[^\"'"'"']+' dist/client/index.html || true)"
          if [ -z "$asset_refs" ]; then
            echo "ERROR: Generated homepage contains no root-relative application assets"
            exit 1
          fi

          while IFS= read -r reference; do
            asset_path="${reference#*=}"
            asset_path="${asset_path#\"}"
            asset_path="${asset_path#\'}"
            check_file "dist/client${asset_path}"
          done <<< "$asset_refs"

          echo ""
          echo "Verification passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain
        shell: bash
        env:
          SITE_URL: https://trikalnetra.com
        run: |
          set -euo pipefail

          routes=(/ /about /services /process /portfolio /faq /contact)

          for attempt in {1..12}; do
            failed=0

            for route in "${routes[@]}"; do
              body="$(mktemp)"
              status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 30 "${SITE_URL}${route}" || true)"

              if [ "$status" != "200" ] || ! grep -qi 'trikalnetra' "$body"; then
                echo "Attempt ${attempt}: ${route} is not serving the application (HTTP ${status:-request-failed})"
                failed=1
              elif grep -Eqi 'generator[^>]*jekyll|Build with Lovable|npm i && npm run dev|Page not found · GitHub Pages' "$body"; then
                echo "Attempt ${attempt}: ${route} is serving Jekyll/README or GitHub's default 404"
                failed=1
              else
                echo "✓ ${route} serves the trikalnetra application"
              fi

              rm -f "$body"
            done

            if [ "$failed" -eq 0 ]; then
              echo "Live custom-domain verification passed."
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Waiting for the Pages deployment to propagate..."
              sleep 10
            fi
          done

          echo "ERROR: The custom domain did not serve the deployed application on every route."
          echo "Check Settings → Pages → Source is GitHub Actions and cancel any legacy 'pages build and deployment' run."
          exit 1