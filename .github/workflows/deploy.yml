name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Prerender static pages
        timeout-minutes: 10
        run: node scripts/prerender.js

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/CNAME
          grep -Fxq 'trikalnetra.com' dist/client/CNAME
          for route in about services process portfolio faq contact; do
            test -f "dist/client/$route/index.html"
          done
          echo "Verified index.html, 404.html, route pages and CNAME"
          find dist/client -maxdepth 2 -type f | sort | head -100

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
